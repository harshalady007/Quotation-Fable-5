name: Pricing quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Grouped source-holdout pricing gate
        run: python scripts/evaluate_production.py --enforce-gate
